<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* ============================================================
         SHORTS STARTER — vertical 9:16 (1080×1920), captioned.
         Speaker opens full-frame → shrinks to corner PiP when the pitch
         ends → returns to full-frame for the close. Pill captions track
         the voice. Renders as-is (placeholder speaker); swap in footage
         where marked. Recolor by editing --brand / --brand-light / --brand-rgb.
         Full engine reference: ../../../references/engine.md
         ============================================================ */

      @font-face { font-family:"Manrope"; src:url("fonts/manrope-latin.woff2") format("woff2"); font-weight:200 800; font-style:normal; unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family:"Manrope"; src:url("fonts/manrope-latinext.woff2") format("woff2"); font-weight:200 800; font-style:normal; unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
      @font-face { font-family:"JetBrains Mono"; src:url("fonts/jbmono-latin.woff2") format("woff2"); font-weight:100 800; font-style:normal; unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family:"JetBrains Mono"; src:url("fonts/jbmono-latinext.woff2") format("woff2"); font-weight:100 800; font-style:normal; unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }

      :root{
        /* --- Brand: change these, the rest derive (see engine.md §brand-derivation) --- */
        --brand:#6366f1; --brand-light:#a5b4fc;
        --brand-rgb:99,102,241;        /* same hex as --brand, for rgba() */
        --bg:#0b0b12; --bg-rgb:11,11,18;
        --text:#eef1f6;
        --dim:rgba(238,241,246,0.60);
        --line:rgba(99,102,241,0.28);
        --glow:rgba(99,102,241,0.22);
        --red:#ff5e5e;                 /* pain/negative words only */
      }

      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:"Manrope",system-ui,sans-serif;color:var(--text);}

      /* ---- backdrop (track 3) ---- */
      #backdrop{position:absolute;inset:0;width:1080px;height:1920px;z-index:0;background:var(--bg);}
      #backdrop .grid{position:absolute;inset:0;background-image:linear-gradient(var(--brand-light) 1px,transparent 1px),linear-gradient(90deg,var(--brand-light) 1px,transparent 1px);background-size:72px 72px;opacity:0.05;}
      #backdrop .glow{position:absolute;bottom:-240px;left:50%;margin-left:-420px;width:840px;height:840px;border-radius:9999px;background:radial-gradient(circle,var(--glow),transparent 62%);filter:blur(60px);}
      #cardGlow{position:absolute;left:50%;top:1180px;margin-left:-360px;width:720px;height:520px;border-radius:9999px;background:radial-gradient(circle,var(--glow),transparent 66%);filter:blur(50px);opacity:0.7;}

      /* ---- speaker (track 0): full-frame → PiP → full-frame ---- */
      #vidframe{position:absolute;top:0;left:0;width:1080px;height:1920px;overflow:hidden;border-radius:0;background:#08080e;box-shadow:0 26px 64px rgba(0,0,0,.72);z-index:1;}
      #vidscale{position:absolute;top:0;left:0;width:1080px;height:1920px;transform-origin:0 0;}
      #vid{display:block;width:100%;height:100%;object-fit:cover;
           background:radial-gradient(130% 90% at 50% 32%,#1b1b27 0%,#0d0d15 58%,#08080e 100%);}
      #vid .placeholder{position:absolute;left:0;right:0;bottom:520px;text-align:center;font-family:"JetBrains Mono",monospace;font-size:26px;font-weight:600;color:var(--dim);}
      #vid .placeholder b{color:var(--brand-light);font-weight:800;}

      /* ---- overlay (track 1) ---- */
      #overlay{position:absolute;inset:0;width:1080px;height:1920px;z-index:5;}

      /* topmark — the only always-on mark, centered near the top */
      .topmark{position:absolute;top:52px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:14px;font-family:"JetBrains Mono",monospace;font-size:26px;font-weight:700;letter-spacing:0.06em;}
      .topmark .ic{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand-light));}
      .topmark .name{color:var(--text);font-weight:800;}
      .topmark .suf{color:var(--dim);}

      /* card stage (below the PiP) */
      .stage-rule{position:absolute;top:902px;left:50%;margin-left:-48px;width:96px;height:5px;background:var(--brand);border-radius:2px;transform:scaleX(0);transform-origin:center;}
      .cardgroup{position:absolute;left:0;right:0;top:935px;height:496px;display:flex;flex-direction:column;align-items:center;justify-content:center;visibility:hidden;}
      .win{width:840px;background:rgba(var(--bg-rgb),0.9);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 26px 60px rgba(0,0,0,.5);}
      .win .cardhead{height:56px;display:flex;align-items:center;gap:10px;padding:0 22px;background:rgba(255,255,255,0.04);border-bottom:1px solid rgba(255,255,255,0.06);font-family:"JetBrains Mono",monospace;font-size:18px;color:var(--dim);}
      .win .tl-dots{display:flex;gap:9px;} .win .tl-dots i{width:13px;height:13px;border-radius:50%;display:block;}
      .win .tl-dots i:nth-child(1){background:#ff5f57;} .win .tl-dots i:nth-child(2){background:#febc2e;} .win .tl-dots i:nth-child(3){background:#28c840;}
      .win .body{padding:40px 44px;}
      .win .body h3{font-size:52px;font-weight:800;letter-spacing:-0.02em;line-height:1.08;}
      .win .body h3 .g{color:var(--brand-light);}
      .win .body p{margin-top:18px;font-size:32px;font-weight:500;line-height:1.35;color:var(--dim);}

      /* captions — pill style, no hyphens, <em> highlights */
      .cap{position:absolute;left:70px;right:70px;bottom:340px;display:flex;justify-content:center;visibility:hidden;}
      .cap .cpill{display:inline-flex;align-items:center;gap:22px;max-width:940px;padding:26px 40px 26px 30px;background:rgba(var(--bg-rgb),0.94);border:1px solid rgba(var(--brand-rgb),0.18);border-radius:6px;box-shadow:0 22px 50px rgba(0,0,0,.55);}
      .cap .accent-bar{width:6px;align-self:stretch;min-height:44px;background:var(--brand);border-radius:2px;flex:none;}
      .cap .ctext{font-size:38px;font-weight:600;line-height:1.22;color:#f5f5f5;letter-spacing:-0.012em;}
      .cap .ctext em{font-style:normal;font-weight:800;color:var(--brand-light);}
      .cap .ctext em.bad{color:var(--red);}

      /* closing CTA badge (reuses the caption look, a touch bigger) */
      #cta{position:absolute;left:70px;right:70px;bottom:360px;display:flex;justify-content:center;visibility:hidden;}
      #cta .cpill{display:inline-flex;align-items:center;gap:18px;padding:30px 46px;background:rgba(var(--bg-rgb),0.94);border:1px solid rgba(var(--brand-rgb),0.28);border-radius:8px;box-shadow:0 22px 50px rgba(0,0,0,.55);font-size:44px;font-weight:800;}
      #cta .arrow{color:var(--brand-light);}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="23" data-width="1080" data-height="1920">

      <div id="backdrop" class="clip" data-track-index="3" data-start="0" data-duration="23">
        <div class="grid"></div><div class="glow"></div><div id="cardGlow"></div>
      </div>

      <!-- GERÇEK GÖRÜNTÜ: re-encode edilmiş klibini assets/ içine koy (örn. konusma-src.mp4). Sonra #vidscale
           içindeki #vid placeholder'ını track-index 0'lı bir video elemanıyla değiştir ve track-index 2'de aynı
           dosyayı data-volume 1 ile çalan bir audio elemanı ekle. Tam işaretleme örneği references/shorts.md içinde. -->
      <div id="vidframe" class="clip" data-track-index="0" data-start="0" data-duration="23">
        <div id="vidscale">
          <div id="vid"><div class="placeholder">▶ Konuşmacı videosu<br><b>assets/&lt;ad&gt;-src.mp4</b></div></div>
        </div>
      </div>

      <div id="overlay" class="clip" data-track-index="1" data-start="0" data-duration="23">

        <div class="topmark"><span class="ic"></span><span class="name">KANAL</span><span class="suf">/// SHORT</span></div>

        <div id="stageRule" class="stage-rule"></div>

        <!-- scene A -->
        <div id="acard" class="cardgroup">
          <div class="win">
            <div class="cardhead"><span class="tl-dots"><i></i><i></i><i></i></span><span>madde 01</span></div>
            <div class="body"><h3>Birinci <span class="g">nokta</span></h3><p>Kısa, net bir açıklama satırı buraya.</p></div>
          </div>
        </div>
        <!-- scene B -->
        <div id="bcard" class="cardgroup">
          <div class="win">
            <div class="cardhead"><span class="tl-dots"><i></i><i></i><i></i></span><span>madde 02</span></div>
            <div class="body"><h3>İkinci <span class="g">nokta</span></h3><p>İkinci maddeyi tek cümlede özetle.</p></div>
          </div>
        </div>

        <!-- captions (one div per spoken line) -->
        <div class="cap" id="cap1"><span class="cpill"><span class="accent-bar"></span><span class="ctext">Bu videoda <em>üç şeyi</em> öğreneceksin</span></span></div>
        <div class="cap" id="cap2"><span class="cpill"><span class="accent-bar"></span><span class="ctext">Birincisi <em>şu noktadan</em> başlıyor</span></span></div>
        <div class="cap" id="cap3"><span class="cpill"><span class="accent-bar"></span><span class="ctext">İkincisi de <em>bu kadar</em> basit</span></span></div>

        <!-- closing CTA -->
        <div id="cta"><span class="cpill">Link açıklamada <span class="arrow">↓</span></span></div>
      </div>
    </div>

    <script>
      /* Deterministic, paused timeline. Literal-second positions (lint needs literals).
         HOOK_END = pitch→explain second (PiP shrink). CLOSE = final CTA second (return to full). */
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // topmark in
      tl.from(".topmark", { y:-14, opacity:0, duration:0.5, ease:"power2.out" }, 0.2);

      // ===== PiP: shrink at HOOK_END (5.0), return to full at CLOSE (20.0) =====
      tl.to("#vidframe", { top:130, left:324, width:432, height:768, borderRadius:24, duration:0.62, ease:"power3.inOut" }, 5.0);
      tl.to("#vidscale", { scale:0.4, duration:0.62, ease:"power3.inOut" }, 5.0);
      tl.to("#stageRule", { scaleX:1, duration:0.55, ease:"power3.out" }, 5.4);
      tl.to("#stageRule", { scaleX:0, duration:0.4, ease:"power2.in" }, 19.75);
      tl.to("#vidframe", { top:0, left:0, width:1080, height:1920, borderRadius:0, duration:0.62, ease:"power3.inOut" }, 20.0);
      tl.to("#vidscale", { scale:1, duration:0.62, ease:"power3.inOut" }, 20.0);

      // ===== card scenes (visibility toggled around each window) =====
      // scene A: 5.6 – 12.0
      tl.set("#acard", { visibility:"visible" }, 5.6);
      tl.from("#acard .win", { y:44, opacity:0, scale:0.96, duration:0.6, ease:"back.out(1.3)" }, 5.7);
      tl.to("#acard", { autoAlpha:0, duration:0.4, ease:"power2.in" }, 11.7);
      tl.set("#acard", { visibility:"hidden" }, 12.1);
      // scene B: 12.2 – 19.2
      tl.set("#bcard", { visibility:"visible", autoAlpha:1 }, 12.2);
      tl.from("#bcard .win", { y:44, opacity:0, scale:0.96, duration:0.6, ease:"back.out(1.3)" }, 12.3);
      tl.to("#bcard", { autoAlpha:0, duration:0.4, ease:"power2.in" }, 18.9);
      tl.set("#bcard", { visibility:"hidden" }, 19.3);

      // ===== captions (enter, exit, hard-kill). Many captions → use the CAPS-array loop in shorts.md =====
      // cap1 : 0.15 – 4.6
      tl.set("#cap1", { visibility:"visible" }, 0.15);
      tl.fromTo("#cap1", { opacity:0, y:26 }, { opacity:1, y:0, duration:0.3, ease:"back.out(1.6)" }, 0.15);
      tl.to("#cap1", { opacity:0, y:-16, duration:0.2, ease:"power2.in" }, 4.4);
      tl.set("#cap1", { visibility:"hidden" }, 4.6);
      // cap2 : 5.7 – 11.5
      tl.set("#cap2", { visibility:"visible" }, 5.7);
      tl.fromTo("#cap2", { opacity:0, y:26 }, { opacity:1, y:0, duration:0.3, ease:"back.out(1.6)" }, 5.7);
      tl.to("#cap2", { opacity:0, y:-16, duration:0.2, ease:"power2.in" }, 11.3);
      tl.set("#cap2", { visibility:"hidden" }, 11.5);
      // cap3 : 12.3 – 18.6
      tl.set("#cap3", { visibility:"visible" }, 12.3);
      tl.fromTo("#cap3", { opacity:0, y:26 }, { opacity:1, y:0, duration:0.3, ease:"back.out(1.6)" }, 12.3);
      tl.to("#cap3", { opacity:0, y:-16, duration:0.2, ease:"power2.in" }, 18.4);
      tl.set("#cap3", { visibility:"hidden" }, 18.6);

      // ===== closing CTA (final beat; drop captions during the full-screen close) =====
      tl.set("#cta", { visibility:"visible" }, 20.6);
      tl.fromTo("#cta", { opacity:0, y:24 }, { opacity:1, y:0, duration:0.5, ease:"back.out(1.5)" }, 20.6);
      tl.to("#cta .arrow", { y:10, duration:0.6, ease:"sine.inOut", yoyo:true, repeat:2 }, 21.2);

      tl.seek(0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
